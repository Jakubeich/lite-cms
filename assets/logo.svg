<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="100" height="100" rx="20" fill="url(#gradient)"/>

  <!-- Document/page shape -->
  <rect x="30" y="25" width="50" height="65" rx="4" fill="white" opacity="0.95"/>

  <!-- Text lines on document -->
  <rect x="38" y="35" width="34" height="4" rx="2" fill="url(#gradient2)" opacity="0.8"/>
  <rect x="38" y="45" width="28" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="38" y="55" width="34" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="38" y="65" width="20" height="4" rx="2" fill="#cbd5e1"/>

  <!-- Pencil/Edit icon -->
  <g transform="translate(62, 52) rotate(-45)">
    <rect x="0" y="0" width="8" height="35" rx="2" fill="url(#gradient2)"/>
    <polygon points="4,35 0,45 8,45" fill="url(#gradient2)"/>
    <rect x="0" y="0" width="8" height="6" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Cursor/caret blinking effect -->
  <rect x="72" y="35" width="2" height="12" rx="1" fill="url(#gradient2)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
